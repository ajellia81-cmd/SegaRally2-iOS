# Builds the unsigned SegaRally2.ipa on a macOS runner.
#
# This repository is public: it holds the port's source only. The ROM and the
# built IPA never touch it. The ROM is the owner's own, a release asset (tag
# "rom", file srally2.zip) of a separate PRIVATE repository; the build reads it
# (the code is recompiled from it) and puts the IPA in that private
# repository's release "ipa", for the owner's own device only. The IPA carries
# no ROM, but it does carry code recompiled from it: it is never uploaded here
# (no artifact, no release), and its build log prints nothing of the ROM.
#
# Needs two settings of this repository (Settings > Secrets and variables > Actions):
#   secret   PRIVATE_REPO_TOKEN  a fine-grained token with Contents read and
#                                write on the private repository only
#   variable PRIVATE_REPO        owner/name of the private repository
#                                (default: <owner>/SegaRally2-iOS-private)
name: iOS build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  ipa:
    # The owner's runs only (never a fork's)
    if: github.repository_owner == 'ajellia81-cmd'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PRIVATE_REPO: ${{ vars.PRIVATE_REPO || format('{0}/SegaRally2-iOS-private', github.repository_owner) }}
    steps:
      - uses: actions/checkout@v4

      - name: Settings
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The secret PRIVATE_REPO_TOKEN is not set (see the top of this file)"
            exit 1
          fi
          gh api "repos/$PRIVATE_REPO" --jq '.private' | grep -qx true || {
            echo "::error::$PRIVATE_REPO is not a private repository this token can read"
            exit 1
          }

      - name: Tools
        run: |
          brew install ninja || true
          cmake --version
          xcodebuild -version
          python3 --version

      - name: ROM (from the private repository; never kept here)
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          mkdir -p rom
          # srally2.zip whole, or in parts (srally2.zip.part0, part1, ...), put
          # back together in order
          gh release download rom --repo "$PRIVATE_REPO" --pattern 'srally2.zip*' --dir rom --clobber
          if [ ! -f rom/srally2.zip ]; then
            cat $(ls rom/srally2.zip.part* | sort -V) > rom/srally2.zip
            rm -f rom/srally2.zip.part*
          fi
          ls -la rom

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: |
            third_party/downloads
            build/moltenvk
          key: deps-${{ hashFiles('third_party/deps.txt', 'platform/ios/build.sh') }}

      - name: Build
        run: platform/ios/build.sh > build.log 2>&1 || { tail -60 build.log; exit 1; }

      - name: Build log (the end)
        if: always()
        run: tail -25 build.log || true

      - name: IPA to the private repository's release "ipa"
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          gh release view ipa --repo "$PRIVATE_REPO" >/dev/null 2>&1 || \
            gh release create ipa --repo "$PRIVATE_REPO" --title "SegaRally2.ipa (private build)" \
              --notes "The latest build, for the owner's own device (LiveContainer). Not for distribution."
          gh release upload ipa build/SegaRally2.ipa --repo "$PRIVATE_REPO" --clobber

      - name: Clean up (ROM and build output off the runner)
        if: always()
        run: rm -rf rom build data
